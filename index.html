<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Style Leaderboard Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .leaderboard-container {
            width: 100%;
            max-width: 1100px;
            background: linear-gradient(135deg, rgba(20, 24, 33, 0.95), rgba(10, 12, 18, 0.98));
            border: 2px solid #3a4454;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 170, 0, 0.2);
            display: grid;
            grid-template-columns: 360px 1fr;
            overflow: hidden;
        }

        /* LEFT SIDEBAR: PLAYER LIST */
        .player-list-section {
            background: rgba(15, 18, 25, 0.9);
            border-right: 2px solid #2a3240;
            display: flex;
            flex-direction: column;
            max-height: 650px;
        }

        .list-header {
            background: linear-gradient(90deg, #1f2633, #151a24);
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #ffcc00;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid #2a3240;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .player-scroll-list {
            overflow-y: auto;
            flex: 1;
            padding: 10px;
        }

        .player-card {
            display: flex;
            align-items: center;
            background: rgba(30, 36, 48, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .player-card:hover, .player-card.active {
            background: rgba(255, 170, 0, 0.15);
            border-color: #ffaa00;
            transform: translateX(4px);
        }

        .rank-num {
            font-size: 18px;
            font-weight: 900;
            width: 30px;
            text-align: center;
            color: #a0aab8;
        }

        .rank-1 { color: #ffe600; text-shadow: 0 0 8px rgba(255, 230, 0, 0.6); }
        .rank-2 { color: #d0d8e0; text-shadow: 0 0 8px rgba(208, 216, 224, 0.6); }
        .rank-3 { color: #e69d5c; text-shadow: 0 0 8px rgba(230, 157, 92, 0.6); }

        .player-avatar {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            margin: 0 10px;
            border: 1px solid #ffaa00;
            background: #252d3a;
            object-fit: cover;
        }

        .player-info {
            flex: 1;
        }

        .player-name {
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 140px;
        }

        .player-points {
            font-size: 12px;
            color: #ffaa00;
        }

        .mini-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            text-align: center;
        }

        /* BADGE COLOR CLASSES */
        .bg-bronze { background: #8c4a21; color: #ffd1b3; border: 1px solid #cd7f32; }
        .bg-silver { background: #5a6578; color: #ffffff; border: 1px solid #a0b0c0; }
        .bg-gold { background: #997300; color: #fff3cc; border: 1px solid #ffd700; }
        .bg-platinum { background: #2b5b84; color: #d6f0ff; border: 1px solid #4a90e2; }
        .bg-diamond { background: #6b21a8; color: #f3e8ff; border: 1px solid #a855f7; }
        .bg-heroic { background: #991b1b; color: #ffe4e4; border: 1px solid #ef4444; }
        .bg-master { background: linear-gradient(45deg, #7e22ce, #b91c1c); color: #fff; border: 1px solid #f59e0b; }

        /* RIGHT MAIN DISPLAY */
        .main-display-section {
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, rgba(30, 40, 60, 0.4) 0%, rgba(10, 12, 18, 0.8) 100%);
        }

        .header-title {
            position: absolute;
            top: 20px;
            font-size: 24px;
            font-weight: 900;
            color: #ffcc00;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
        }

        .tier-banner {
            font-size: 28px;
            font-weight: 900;
            color: #4a90e2;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(74, 144, 226, 0.6);
        }

        .large-badge-box {
            position: relative;
            width: 180px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 25px;
        }

        .badge-icon-svg {
            width: 140px;
            height: 140px;
            filter: drop-shadow(0 0 20px rgba(74, 144, 226, 0.8));
        }

        .master-point-overlay {
            position: absolute;
            top: 10px;
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid #f59e0b;
            color: #f59e0b;
            font-size: 11px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
        }

        /* PROGRESS BAR */
        .progress-box {
            width: 80%;
            max-width: 400px;
            text-align: center;
        }

        .progress-bar-bg {
            width: 100%;
            height: 16px;
            background: #151a24;
            border-radius: 10px;
            border: 1px solid #3a4454;
            overflow: hidden;
            margin-bottom: 8px;
            box-shadow: inset 0 0 5px #000;
        }

        .progress-bar-fill {
            height: 100%;
            width: 75%;
            background: linear-gradient(90deg, #ff9900, #ffcc00);
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.8);
            transition: width 0.4s ease;
        }

        .progress-text {
            font-size: 13px;
            color: #a0aab8;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .leaderboard-container {
                grid-template-columns: 1fr;
            }
            .player-list-section {
                max-height: 350px;
            }
        }
    </style>
</head>
<body>

<div class="leaderboard-container">
    <!-- LEFT: PLAYER LIST (10 USERS) -->
    <div class="player-list-section">
        <div class="list-header">
            <span>Monthly Rank</span>
            <span style="font-size: 12px; color: #a0aab8;">Top 10</span>
        </div>
        <div class="player-scroll-list" id="playerList">
            <!-- JS dynamically injects 10 players here -->
        </div>
    </div>

    <!-- RIGHT: MAIN SELECTED PLAYER / BADGE DISPLAY -->
    <div class="main-display-section">
        <div class="header-title">MONTHLY LEADERBOARD</div>
        
        <div class="tier-banner" id="mainTierTitle">PLATINUM III</div>

        <div class="large-badge-box">
            <!-- Master/Grandmaster level point indicator over badge -->
            <div class="master-point-overlay" id="masterPointTag" style="display: none;">Pts: 5,420</div>
            
            <!-- SVG BADGE SHIELD -->
            <svg class="badge-icon-svg" id="mainBadgeSvg" viewBox="0 0 100 100">
                <path d="M50 5 L90 20 L80 75 L50 95 L20 75 L10 20 Z" fill="url(#blueGrad)" stroke="#4a90e2" stroke-width="3"/>
                <path d="M50 20 L75 32 L68 65 L50 78 L32 65 L25 32 Z" fill="#151a24" stroke="#d6f0ff" stroke-width="1.5"/>
                <!-- Chevron symbols for III -->
                <path d="M40 42 L50 50 L60 42" fill="none" stroke="#d6f0ff" stroke-width="3" stroke-linecap="round"/>
                <path d="M40 50 L50 58 L60 50" fill="none" stroke="#d6f0ff" stroke-width="3" stroke-linecap="round"/>
                <path d="M40 58 L50 66 L60 58" fill="none" stroke="#d6f0ff" stroke-width="3" stroke-linecap="round"/>
                <defs>
                    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#1e40af" />
                        <stop offset="100%" stop-color="#3b82f6" />
                    </linearGradient>
                </defs>
            </svg>
        </div>

        <div class="progress-box">
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar" style="width: 78%;"></div>
            </div>
            <div class="progress-text" id="progressText">SCORE: 2,450 / 3,000 (78%)</div>
        </div>
    </div>
</div>

<script>
    // DEMO DATA: 10 PLAYERS WITH FREE FIRE RANKS
    const players = [
        { rank: 1, name: "⚡ RAFIKUL_PRO", score: 6250, badge: "Master II", bgClass: "bg-master", isMaster: true },
        { rank: 2, name: "🔥 TANVIR_BOSS", score: 5120, badge: "Heroic", bgClass: "bg-heroic", isMaster: true },
        { rank: 3, name: "🎯 SHAKIB_75", score: 4300, badge: "Diamond IV", bgClass: "bg-diamond", isMaster: false },
        { rank: 4, name: "🚀 MITHUN_FF", score: 3850, badge: "Diamond II", bgClass: "bg-diamond", isMaster: false },
        { rank: 5, name: "👑 ANIK_GAMER", score: 2950, badge: "Platinum IV", bgClass: "bg-platinum", isMaster: false },
        { rank: 6, name: " SweetLuvy", score: 2450, badge: "Platinum III", bgClass: "bg-platinum", isMaster: false },
        { rank: 7, name: "🛡️ HASAN_OP", score: 1820, badge: "Gold III", bgClass: "bg-gold", isMaster: false },
        { rank: 8, name: "⚔️ RAHIM_99", score: 1410, badge: "Gold I", bgClass: "bg-gold", isMaster: false },
        { rank: 9, name: "⚡ NOOB_MASTER", score: 850, badge: "Silver II", bgClass: "bg-silver", isMaster: false },
        { rank: 10, name: "🐣 NEWBIE_01", score: 320, badge: "Bronze I", bgClass: "bg-bronze", isMaster: false }
    ];

    const playerListContainer = document.getElementById("playerList");

    // RENDER 10 PLAYERS
    players.forEach((p, index) => {
        const card = document.createElement("div");
        card.className = `player-card ${index === 5 ? 'active' : ''}`;
        
        let rankClass = "";
        if(p.rank === 1) rankClass = "rank-1";
        else if(p.rank === 2) rankClass = "rank-2";
        else if(p.rank === 3) rankClass = "rank-3";

        card.innerHTML = `
            <div class="rank-num ${rankClass}">${p.rank}</div>
            <img class="player-avatar" src="https://api.dicebear.com/7.x/bottts/svg?seed=${p.name}" alt="Avatar">
            <div class="player-info">
                <div class="player-name">${p.name}</div>
                <div class="player-points">${p.score.toLocaleString()} Pts</div>
            </div>
            <div class="mini-badge ${p.bgClass}">${p.badge}</div>
        `;

        card.onclick = () => selectPlayer(p, card);
        playerListContainer.appendChild(card);
    });

    // FUNCTION TO UPDATE RIGHT PANEL DISPLAY
    function selectPlayer(p, cardElement) {
        document.querySelectorAll(".player-card").forEach(c => c.classList.remove("active"));
        cardElement.classList.add("active");

        document.getElementById("mainTierTitle").innerText = p.badge;
        
        // Show points overlay tag if Master/Heroic
        const masterTag = document.getElementById("masterPointTag");
        if(p.isMaster) {
            masterTag.style.display = "block";
            masterTag.innerText = `Pts: ${p.score}`;
        } else {
            masterTag.style.display = "none";
        }

        // Update progress bar
        const percent = Math.min(Math.round((p.score / 6500) * 100), 100);
        document.getElementById("progressBar").style.width = percent + "%";
        document.getElementById("progressText").innerText = `SCORE: ${p.score.toLocaleString()} / 6,500 (${percent}%)`;
    }
</script>

</body>
</html>
